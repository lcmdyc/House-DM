<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>TRPG 模组 DM 工具</title>
  <!-- 带版本参数强破浏览器 CSS 强缓存 -->
  <link rel="stylesheet" href="style.css?v=light2">
  <!-- WebRTC 多人联机库 -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="edit">
  <!-- 顶部操作栏 -->
  <header>
    <h1>🎲 DM 工作台</h1>
    <input type="text" id="modTitle" class="title" placeholder="模组名称" title="点击直接修改模组名">
    <button id="modeBtn" class="on" onclick="toggleMode()">✏️ 编辑模式</button>
    <button id="dayBtn" onclick="openDays()">📅 Day 1</button>
    <button id="endDayBtn" class="primary" onclick="endDay()">Day 1 结束 ▶</button>
    <button id="playersBtn" onclick="openPlayers()">👥 玩家(4)</button>
    <button onclick="openSummary()">🎒 物资总览</button>
    <button onclick="openLog()">📜 日志</button>
    <button onclick="openHandbook()">📖 导出手册</button>

    <div class="spacer"></div>

    <!-- 配色切换按钮 -->
    <button id="themeBtn" title="切换浅色/深色主题">🌙 深色</button>
    <button id="p2pBtn" title="点击复制邀请链接">🔗 启动多人协作</button>
    <button onclick="exportData()">💾 导出备份</button>
    <label class="button" style="display:inline-flex;align-items:center;cursor:pointer;background:var(--card);padding:5px 11px;border-radius:4px;border:1px solid var(--line);font-size:12.5px">
      📂 导入
      <input type="file" accept=".json" onchange="importData(event)" style="display:none">
    </label>
    <button class="danger" onclick="resetAll()">重置模组</button>
  </header>

  <!-- 主内容区 -->
  <main>
    <!-- 玩家属性侧栏 -->
    <div id="strip"></div>
    <button id="stripOpen" onclick="setStrip(true)">👥 玩家属性</button>

    <!-- 地图平移缩放视窗 -->
    <div id="mapWrap">
      <div id="grid"></div>
      <button id="centerBtn" onclick="centerView()">⌖ 视角居中</button>
      <div id="panHint">按住空白处拖拽画布 · 滚轮上下移动 · Shift+滚轮左右移动</div>
    </div>

    <!-- 二级房间详情侧栏 -->
    <div id="side"></div>

    <!-- 三级场景实体/遭遇侧栏 -->
    <div id="entitySide"></div>
  </main>

  <!-- 浮动通知 Toast -->
  <div id="toast"></div>

  <!-- 弹窗 1：属性侧栏配置 -->
  <dialog id="stripDlg" style="width:360px">
    <div class="tabs">
      <b style="color:var(--accent)">⚙ 玩家属性栏设置</b>
      <div class="spacer"></div>
      <button onclick="stripAll(true)">全选</button>
      <button onclick="stripAll(false)">全不选</button>
      <button onclick="document.getElementById('stripDlg').close()">✕</button>
    </div>
    <div id="stripCfgBox" style="display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow-y:auto"></div>
  </dialog>

  <!-- 弹窗 2：日程管理 -->
  <dialog id="dayDlg" style="width:780px;max-width:92vw">
    <div class="tabs">
      <b style="color:var(--accent);font-size:15px">📅 日程推进与事件表</b>
      <div class="spacer"></div>
      <button onclick="dayDlg.close()">✕ 关闭</button>
    </div>
    <div class="bgwrap">
      <div id="dayNav" class="bgnav"></div>
      <div id="dayMain" class="bgmain"></div>
    </div>
  </dialog>

  <!-- 弹窗 3：玩家管理 -->
  <dialog id="playersDlg" style="width:520px;max-width:92vw">
    <div class="tabs">
      <b style="color:var(--accent);font-size:15px">👥 玩家队伍设置</b>
      <span id="plCount" class="hint"></span>
      <div class="spacer"></div>
      <button class="primary" onclick="addPlayer()">＋ 新增玩家</button>
      <button onclick="closePlayers()">✕ 完成</button>
    </div>
    <div id="playersBox" style="max-height:60vh;overflow-y:auto;padding-right:4px"></div>
  </dialog>

  <!-- 弹窗 4：玩家背景与车卡 -->
  <dialog id="bgDlg" style="width:840px;max-width:94vw">
    <div class="tabs">
      <b style="color:var(--accent);font-size:15px">📜 玩家预设背景与车卡</b>
      <div class="spacer"></div>
      <button onclick="bgDlg.close()">✕ 关闭</button>
    </div>
    <div class="bgwrap">
      <div id="bgNav" class="bgnav"></div>
      <div id="bgMain" class="bgmain"></div>
    </div>
  </dialog>

  <!-- 弹窗 5：物资总览池 -->
  <dialog id="sumDlg" style="width:820px;max-width:92vw">
    <div class="tabs">
      <b style="color:var(--accent);font-size:15px">🎒 物资全览池与分配</b>
      <div class="spacer"></div>
      <button class="primary" onclick="addPoolItem()">＋ 新物资</button>
      <button onclick="document.getElementById('sumDlg').close()">✕ 关闭</button>
    </div>
    <div class="ptool">
      <input type="text" id="poolQ" placeholder="搜索物资名称、描述、检定条件…" oninput="poolQ=this.value;renderPool()">
      <select id="poolT" onchange="poolT=this.value;renderPool()">
        <option value="">全部类型</option>
        <option value="item">道具</option>
        <option value="clue">线索</option>
      </select>
    </div>
    <div id="poolList" style="max-height:60vh;overflow-y:auto;padding-right:4px"></div>
  </dialog>

  <!-- 弹窗 6：运行日志 -->
  <dialog id="logDlg" style="width:700px;max-width:92vw">
    <div class="tabs">
      <b style="color:var(--accent);font-size:15px">📜 模组运行日志</b>
      <div id="logTabs" style="display:flex;gap:4px;margin-left:10px"></div>
      <div class="spacer"></div>
      <button onclick="copyLog()">📋 复制文本</button>
      <button class="danger" onclick="clearLog()">清空日志</button>
      <button onclick="document.getElementById('logDlg').close()">✕ 关闭</button>
    </div>
    <div id="logList"></div>
  </dialog>

  <!-- 弹窗 7：导出手册 -->
  <dialog id="hbDlg" style="width:900px;max-width:96vw">
    <div class="tabs">
      <button id="hbTabDm" class="on" onclick="setHbMode('dm')">📖 DM 完整手册</button>
      <button id="hbTabPl" onclick="setHbMode('pl')">👥 玩家发放版</button>
      <div class="spacer"></div>
      <button onclick="refreshHandbook()">🔄 刷新预览</button>
      <button onclick="printHandbook()">🖨️ 打印 / 另存为 PDF</button>
      <button class="primary" onclick="downloadHandbook()">⬇ 下载 HTML 文件</button>
      <button onclick="document.getElementById('hbDlg').close()">✕ 关闭</button>
    </div>
    <div id="hbOptDm" class="hbopts">
      <label><input type="checkbox" id="hbDM" checked onchange="refreshHandbook()">包含 DM 专属内容</label>
      <label><input type="checkbox" id="hbPl" checked onchange="refreshHandbook()">包含玩家队伍与背景</label>
      <label><input type="checkbox" id="hbSt" checked onchange="refreshHandbook()">包含未分配物资池</label>
      <label><input type="checkbox" id="hbDup" checked onchange="refreshHandbook()">包含地图概览</label>
    </div>
    <div id="hbOptPl" class="hbopts" style="display:none">
      <label><input type="checkbox" id="hpBg" checked onchange="refreshHandbook()">包含身份与目的</label>
      <label><input type="checkbox" id="hpFill" checked onchange="refreshHandbook()">预填数值</label>
      <label><input type="checkbox" id="hpSplit" checked onchange="refreshHandbook()">每位角色独立分页打印</label>
    </div>
    <iframe id="hbFrame"></iframe>
  </dialog>

  <!-- 引入逻辑脚本 -->
  <script src="js/data.js"></script>
  <script src="js/handbook.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
