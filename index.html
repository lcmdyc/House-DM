<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRPG 模组 · DM 工具</title>
<style>
  :root{--bg:#1b1a22;--panel:#25242e;--card:#2e2d39;--line:#3d3b4d;--text:#e8e6f0;--mute:#9b98ad;--accent:#d9a441;--clue:#4aa8d8;--item:#8bc34a;--skill:#b27cd8;--danger:#e0605e;--npc:#e8853a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:16px;margin:0 8px 0 0;color:var(--accent)}
  header input.title{background:transparent;border:1px solid transparent;color:var(--text);font-size:16px;font-weight:bold;padding:2px 6px;border-radius:4px;width:200px}
  header input.title:hover,header input.title:focus{border-color:var(--line)}
  .spacer{flex:1}
  button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#222;border-color:var(--accent);font-weight:bold}
  button.danger{color:var(--danger)}
  button.on{background:var(--accent);color:#222}
  main{flex:1;display:flex;min-height:0;position:relative}
  #mapWrap{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:20px 20px}
  #mapWrap.dragging{cursor:grabbing}
  #grid{position:absolute;left:0;top:0;display:grid;gap:14px;width:max-content;will-change:transform}
  #centerBtn{position:absolute;left:14px;bottom:14px;z-index:5;background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.4)}
  #stripOpen{position:absolute;left:14px;top:14px;z-index:5;background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.4);display:none}
  #panHint{position:absolute;right:14px;bottom:14px;z-index:5;font-size:12px;color:var(--mute);pointer-events:none}
  .cell{width:130px;height:100px;position:relative}
  .room{width:100%;height:100%;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:20px 20px 18px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
  .room:hover{border-color:var(--accent)}
  .room.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,164,65,.25)}
  .room .name{font-weight:bold;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.4}
  .room .stat{font-size:11px;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
  .room .pl{display:flex;flex-wrap:wrap;gap:2px;max-height:38px;overflow:hidden}
  .chip{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;font-size:10px;font-style:normal;font-weight:bold;color:#111;border:1px solid rgba(0,0,0,.35)}
  /* 门标记：房间卡片内侧，各边居中 */
  .dr{display:inline-block;width:16px;height:16px;border-radius:4px;font-size:10px;line-height:14px;text-align:center;font-weight:bold;font-style:normal;color:#111;border:1px solid rgba(0,0,0,.5);flex:none}
  .dr.door{background:var(--accent)}.dr.open{background:#cfcfd8}.dr.lock{background:var(--danger);color:#fff}.dr.out,.dr.in{background:var(--clue)}
  .cell>.dr{position:absolute;z-index:3;pointer-events:none}
  .cell>.dr.N{top:4px;left:calc(50% - 8px)}.cell>.dr.S{bottom:4px;left:calc(50% - 8px)}
  .cell>.dr.E{right:4px;top:calc(50% - 8px)}.cell>.dr.W{left:4px;top:calc(50% - 8px)}
  .add{position:absolute;width:22px;height:22px;border-radius:50%;padding:0;background:var(--accent);color:#222;border:none;font-weight:bold;line-height:22px;z-index:4;display:none}
  body.edit .cell:hover .add{display:block}
  .add.t{top:-11px;left:calc(50% - 11px)}.add.bm{bottom:-11px;left:calc(50% - 11px)}
  .add.l{left:-11px;top:calc(50% - 11px)}.add.r{right:-11px;top:calc(50% - 11px)}
  .drow{display:flex;gap:6px;align-items:center;margin-bottom:6px;font-size:13px}
  .drow>b{width:24px;flex:none;color:var(--mute)}
  .drow select{width:150px;flex:none}
  #strip{width:210px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
  #strip.hide{display:none}
  .sthead{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:bold;color:var(--accent)}
  .sthead button{padding:1px 7px;font-size:12px}
  .pc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}
  .pc:hover{border-color:var(--accent)}
  .pc .pn{font-weight:bold;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pc .cn{font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pc select.prm{margin-top:3px;padding:1px 4px;font-size:11px;color:var(--mute)}
  .pc .as{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;margin-top:4px;font-size:12px}
  .pc .as span{display:flex;justify-content:space-between;gap:4px;min-width:0}
  .pc .as i{font-style:normal;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pc .as b{color:var(--accent)}
  .pc .as .z b{color:var(--mute);font-weight:normal}
  .chkrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
  .chkrow input{width:16px;height:16px}
  #side{width:380px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;display:none;padding:14px;position:relative}
  #side.open{display:block}
  /* 专属实体/NPC侧栏 */
  #entitySide{width:420px;max-width:100%;background:#22212b;border-left:2px solid var(--accent);overflow-y:auto;display:none;padding:14px;position:relative;z-index:10;box-shadow:-4px 0 16px rgba(0,0,0,.4)}
  #entitySide.open{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px}
  .card h3{margin:0 0 6px;font-size:13px;color:var(--accent);display:flex;align-items:center;justify-content:space-between}
  textarea,input[type=text],input[type=number],select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
  textarea{resize:vertical;min-height:70px}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent)}
  input[type=color]{width:34px;height:30px;padding:1px;flex:none;background:var(--bg);border:1px solid var(--line);border-radius:6px;cursor:pointer}
  label.s{font-size:12px;color:var(--mute);display:block;margin:6px 0 2px}
  .sidehead{display:flex;gap:6px;margin-bottom:12px;align-items:center}
  .sidehead input{font-size:16px;font-weight:bold}
  .here{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
  .here span{display:inline-flex;align-items:center;gap:4px}
  .item{border-left:4px solid var(--item);background:var(--panel);border-radius:6px;padding:8px;margin-top:8px;transition:opacity .2s}
  .item.clue{border-left-color:var(--clue)}
  .item.skill{border-left-color:var(--skill)}
  .item.consumed{opacity:.4;filter:grayscale(.7);border-left-color:var(--line)}
  .item.npc{border-left-color:var(--npc);background:#2c2830}
  .item.npc:hover{border-color:var(--npc)}
  .item .row{display:flex;gap:6px;align-items:center}
  .item.compact{padding:6px 8px;margin-top:6px;cursor:pointer}
  .item.compact:hover{background:#2b2a35}
  .item.compact .row{align-items:flex-start}
  .item.compact .memo{flex:1;min-width:0;line-height:1.35;word-break:break-all}
  .item.compact .memo b{font-size:14px}
  .item.compact .memo .cd{display:block;font-size:12px;color:var(--mute)}
  .item.compact .copyi{font-size:11px;color:var(--mute);white-space:nowrap;margin-top:2px}
  .item.compact .status{margin-top:5px;padding-top:5px}
  .item.compact .pbtn{padding:1px 7px;font-size:11px}
  .item.compact .cbtn{padding:1px 8px;font-size:11px}
  .item.compact.rd{border-left-color:var(--accent);background:var(--card);margin:0 0 12px;padding:8px 10px}
  .item.compact.rd .memo .cd{white-space:pre-wrap;color:var(--text);opacity:.85;margin-top:2px;max-height:11em;overflow:auto}
  .item.compact.rd .memo .cd.emp{color:var(--mute);font-style:italic}
  .tag{font-size:11px;padding:1px 8px;border-radius:10px;color:#111;font-weight:bold;cursor:pointer;white-space:nowrap;border:none}
  .tag.clue{background:var(--clue)}.tag.item{background:var(--item)}.tag.skill{background:var(--skill)}.tag.npc{background:var(--npc);color:#fff}
  .tag.static{cursor:inherit}
  .status{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .pbtn{padding:2px 9px;border-radius:12px;font-size:12px;background:transparent;color:var(--mute)}
  .pbtn.on{background:var(--accent);color:#222;border-color:var(--accent);font-weight:bold}
  .cbtn{margin-left:auto;padding:2px 10px;border-radius:12px;font-size:12px;color:var(--danger);border-color:var(--danger);background:transparent}
  .cbtn.on{background:var(--danger);color:#fff}
  .hint{color:var(--mute);font-size:12px}
  .empty{text-align:center;padding:40px 60px;color:var(--mute)}
  #toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--accent);color:#222;padding:6px 16px;border-radius:20px;font-weight:bold;font-size:13px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.show{opacity:1}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:18px;width:360px}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .prow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .prow span{width:20px;color:var(--mute);flex:none}
  .prow select{width:130px;flex:none}
  #playersBox{max-height:55vh;overflow:auto;padding-right:4px}
  .tabs{display:flex;gap:6px;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:8px;align-items:center;flex-wrap:wrap}
  .tabs button.on{font-weight:bold}
  .ptool{display:flex;gap:6px;margin-bottom:8px;align-items:center}
  .ptool input{flex:1}.ptool select{width:auto}
  .sec{margin:12px 0 4px;font-size:12px;color:var(--accent);font-weight:bold;display:flex;justify-content:space-between;align-items:center}
  .sec.un{color:var(--clue)}
  .prow2{background:var(--card);border-left:4px solid var(--item);border-radius:6px;padding:6px 8px;margin-bottom:6px}
  .prow2.clue{border-left-color:var(--clue)}
  .prow2.consumed{opacity:.45}
  .prow2 .l1{display:flex;gap:6px;align-items:center}
  .prow2 .l1 select{width:150px;flex:none}
  .prow2 .l2{display:flex;gap:6px;margin-top:4px}
  .prow2 .l2 input{font-size:12px;padding:3px 6px}
  .mini{font-size:11px;color:var(--mute);white-space:nowrap}
  .bgwrap{display:flex;gap:14px}
  .bgnav{width:120px;flex:none;display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
  .bgnav button{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bgmain{flex:1;min-width:0;overflow:auto;max-height:70vh;padding-right:4px}
  .bgmain .nm{font-size:18px;font-weight:bold;margin-bottom:10px}
  .goal{display:flex;gap:8px;align-items:flex-start;margin-top:8px;background:var(--panel);border-left:4px solid var(--accent);border-radius:6px;padding:8px}
  .goal textarea{min-height:44px}
  .goal.done{opacity:.5;border-left-color:var(--line)}
  .goal.done textarea{text-decoration:line-through}
  .goal input[type=checkbox]{margin-top:8px;width:16px;height:16px;flex:none}
  .divider{display:flex;align-items:center;gap:10px;margin:16px 0 10px;color:var(--mute);font-size:12px}
  .divider::before,.divider::after{content:"";flex:1;border-top:1px dashed var(--line)}
  .divider b{color:var(--text);font-size:14px}
  .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
  .cf{display:flex;align-items:center;gap:6px}
  .cf>span{width:34px;flex:none;color:var(--mute);font-size:13px}
  .ptsbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;background:var(--panel);border-radius:6px;padding:6px 10px}
  .ptsbar input{width:64px;text-align:center}
  .remain{margin-left:auto;font-weight:bold}
  .remain.ok{color:var(--item)}.remain.zero{color:var(--accent)}.remain.over{color:var(--danger)}
  .attr{display:flex;align-items:center;gap:4px}
  .attr .an{width:64px;flex:none;padding:4px 6px;background:transparent;border-color:transparent;color:var(--text)}
  .attr .an:hover,.attr .an:focus{border-color:var(--line);background:var(--bg)}
  .attr .av{width:52px;text-align:center;padding:4px 2px}
  .attr button{padding:1px 8px}
  .attr .x{padding:1px 5px;font-size:11px;opacity:.5}.attr .x:hover{opacity:1}
  input[type=number]::-webkit-inner-spin-button{opacity:.4}
  #dayBtn{border-color:var(--accent);color:var(--accent);font-weight:bold}
  .daynav button{display:flex;justify-content:space-between;gap:6px;align-items:center}
  .daynav button.cur{border-color:var(--accent)}
  .dtag{font-size:10px;opacity:.9}
  .dayhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .dayhead .nm{font-size:18px;font-weight:bold;margin-right:auto}
  .badge2{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--line)}
  .badge2.cur{background:var(--accent);color:#222;font-weight:bold}
  .ev{background:var(--card);border-left:4px solid var(--accent);border-radius:6px;padding:8px;margin-bottom:8px}
  .ev .r1{display:flex;gap:6px;align-items:center}
  .ev .r1 input[type=checkbox]{width:16px;height:16px;flex:none}
  .ev .tm{width:96px;flex:none}
  .ev textarea{min-height:44px;margin-top:6px}
  .ev.done{opacity:.5;border-left-color:var(--line)}
  .ev.done .tt{text-decoration:line-through}
  #logList{overflow:auto;max-height:64vh}
  .lg{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-left:4px solid var(--line);background:var(--card);border-radius:6px;margin-bottom:4px;font-size:13px}
  .lg.item{border-left-color:var(--item)}.lg.attr{border-left-color:var(--skill)}.lg.move{border-left-color:var(--clue)}.lg.day{border-left-color:var(--accent);background:#33301f}
  .lg .ld{font-size:11px;color:var(--accent);white-space:nowrap;flex:none;width:44px}
  .lg .lt{font-size:11px;color:var(--mute);white-space:nowrap;flex:none;width:38px}
  .lg .lx{flex:1;word-break:break-all}
  .lg .cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
  .hbopts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:13px}
  .hbopts label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .hbopts input{width:15px;height:15px}
  #hbFrame{width:100%;height:62vh;border:1px solid var(--line);border-radius:6px;background:#fff}
  /* 行为列表项 */
  .act-item{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:6px}
  .act-head{display:flex;gap:6px;align-items:center;margin-bottom:4px}
  .act-head input{font-weight:bold}
</style>
</head>
<body class="edit">
<header>
  <h1>🎲 模组 DM 工具</h1>
  <input class="title" id="modTitle" placeholder="模组名称">
  <div class="spacer"></div>
  <button id="dayBtn" onclick="openDays()" title="查看 / 编辑日程">📅 Day 1</button>
  <button id="endDayBtn" class="primary" onclick="endDay()">Day 1 结束 ▶</button>
  <button id="modeBtn" class="on" onclick="toggleMode()" title="切换编辑 / 带团模式">✏️ 编辑模式</button>
  <button onclick="openBg()">🧑‍🎤 玩家背景</button>
  <button id="playersBtn" onclick="openPlayers()">👥 玩家</button>
  <button onclick="openSummary()">📦 物资总览</button>
  <button onclick="openLog()">📜 日志</button>
  <button class="primary" onclick="openHandbook()" title="生成可打印的带团手册 / 玩家发放版">📖 导出手册</button>
  <button onclick="exportData()" title="导出 JSON 备份文件，可再导入">导出备份</button>
  <button onclick="document.getElementById('imp').click()">导入</button>
  <input type="file" id="imp" accept=".json" hidden onchange="importData(event)">
  <button class="danger" onclick="resetAll()">重置</button>
</header>
<main>
  <aside id="strip"></aside>
  <div id="mapWrap">
    <div id="grid"></div>
    <button id="stripOpen" title="展开玩家属性栏" onclick="setStrip(true)">▶ 玩家属性</button>
    <button id="centerBtn" title="把整张地图移回画布中央" onclick="centerView()">🎯 居中视图</button>
    <div id="panHint">按住空白处或房间拖动 · 滚轮平移</div>
  </div>
  <aside id="side"></aside>
  <!-- 第三级：实体/NPC/怪物独立侧栏 -->
  <aside id="entitySide"></aside>
</main>
<div id="toast"></div>

<dialog id="playersDlg" style="width:500px;max-width:95vw">
  <h3 style="margin-top:0">玩家名单 <span class="hint" id="plCount"></span></h3>
  <div class="hint" style="margin-bottom:6px">每行：代表色 · 名字 · 所在房间</div>
  <div id="playersBox"></div>
  <div style="display:flex;justify-content:space-between;margin-top:10px">
    <button onclick="addPlayer()">＋ 新增玩家</button>
    <button class="primary" onclick="closePlayers()">完成</button>
  </div>
</dialog>

<dialog id="stripDlg">
  <h3 style="margin-top:0">属性栏显示设置</h3>
  <div class="hint" style="margin-bottom:6px">勾选的属性会显示在地图左侧的玩家小视窗里。</div>
  <div style="display:flex;gap:6px;margin-bottom:6px">
    <button onclick="stripAll(true)">全选</button>
    <button onclick="stripAll(false)">全不选</button>
  </div>
  <div id="stripCfgBox" style="max-height:50vh;overflow:auto"></div>
  <div style="text-align:right;margin-top:10px"><button class="primary" onclick="document.getElementById('stripDlg').close()">完成</button></div>
</dialog>

<dialog id="dayDlg" style="width:880px;max-width:95vw;max-height:90vh">
  <div class="tabs">
    <b style="color:var(--accent)">📅 日程</b>
    <div class="spacer"></div>
    <button onclick="document.getElementById('dayDlg').close()">关闭</button>
  </div>
  <div class="bgwrap">
    <div class="bgnav daynav" id="dayNav"></div>
    <div class="bgmain" id="dayMain"></div>
  </div>
</dialog>

<dialog id="bgDlg" style="width:880px;max-width:95vw;max-height:90vh">
  <div class="tabs">
    <b style="color:var(--accent)">🧑‍🎤 玩家背景</b>
    <div class="spacer"></div>
    <button onclick="document.getElementById('bgDlg').close()">关闭</button>
  </div>
  <div class="bgwrap">
    <div class="bgnav" id="bgNav"></div>
    <div class="bgmain" id="bgMain"></div>
  </div>
</dialog>

<dialog id="sumDlg" style="width:760px;max-width:95vw;max-height:88vh">
  <div class="tabs">
    <b style="color:var(--accent)">🗃 物资池总览 / 分配</b>
    <div class="spacer"></div>
    <button onclick="document.getElementById('sumDlg').close()">关闭</button>
  </div>
  <div class="ptool">
    <input type="text" id="poolQ" placeholder="搜索名称 / 描述 / 条件…" oninput="poolQ=this.value;renderPool()">
    <select id="poolT" onchange="poolT=this.value;renderPool()">
      <option value="">全部类型</option><option value="clue">仅线索</option><option value="item">仅道具</option>
    </select>
    <button class="primary" onclick="addPoolItem()">＋ 新物资</button>
  </div>
  <div class="hint" style="margin-bottom:4px">「未分配」是还没放进任何房间的物资。用右侧下拉框可把物资快速移入任意房间，或移回未分配。获取记录请看顶部「📜 日志」。</div>
  <div id="poolList" style="overflow:auto;max-height:60vh"></div>
</dialog>

<dialog id="logDlg" style="width:760px;max-width:95vw;max-height:90vh">
  <div class="tabs">
    <b style="color:var(--accent)">📜 日志</b>
    <span id="logTabs" style="display:flex;gap:6px;flex-wrap:wrap"></span>
    <div class="spacer"></div>
    <button onclick="copyLog()">📋 复制</button>
    <button class="danger" onclick="clearLog()">清空</button>
    <button onclick="document.getElementById('logDlg').close()">关闭</button>
  </div>
  <div id="logList"></div>
</dialog>

<dialog id="hbDlg" style="width:980px;max-width:96vw;max-height:95vh">
  <div class="tabs">
    <button id="hbTabDm" class="on" onclick="setHbMode('dm')">📖 DM 带团手册</button>
    <button id="hbTabPl" onclick="setHbMode('pl')">🧾 玩家发放版</button>
    <div class="spacer"></div>
    <button class="primary" onclick="printHandbook()">🖨 打印 / 另存为 PDF</button>
    <button onclick="downloadHandbook()">⬇ 下载 HTML</button>
    <button onclick="document.getElementById('hbDlg').close()">关闭</button>
  </div>
  <div class="hbopts" id="hbOptDm">
    <label><input type="checkbox" id="hbDM" checked onchange="refreshHandbook()">DM 专属内容</label>
    <label><input type="checkbox" id="hbPl" checked onchange="refreshHandbook()">玩家角色页（背景 + 车卡）</label>
    <label><input type="checkbox" id="hbSt" onchange="refreshHandbook()">带上当前进度（位置、已获取、已填数值）</label>
  </div>
  <div class="hbopts" id="hbOptPl" style="display:none">
    <label><input type="checkbox" id="hpBg" checked onchange="refreshHandbook()">包含预设背景（身份 / 技能 / 目的）</label>
    <label><input type="checkbox" id="hpFill" onchange="refreshHandbook()">预填已有车卡数值（不勾选＝空白车卡）</label>
    <label><input type="checkbox" id="hpSplit" onchange="refreshHandbook()">背景在正面、车卡在背面（每人 2 页）</label>
  </div>
  <div class="hbopts">
    <label><input type="checkbox" id="hbDup" checked onchange="refreshHandbook()">双面打印优化（章节 / 每位玩家从右页开始，装订侧加宽，带页码）</label>
  </div>
  <iframe id="hbFrame" title="手册预览"></iframe>
  <div class="hint" style="margin-top:6px">打印窗口里选择「A4」，建议关闭「页眉和页脚」，并勾选「双面打印」。每个房间固定从新页开始。</div>
</dialog>

<script>
const KEY='trpg_module_v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const DEFAULT_DATA=null;

const PALETTE=['#e0605e','#e8a13a','#e6d24a','#8bc34a','#4cc9a0','#4aa8d8','#6c7be0','#b27cd8','#e37bb6','#9b8b7a','#ff8a5c','#7fd0e0'];
const INFO_FIELDS=[['name','姓名'],['gender','性别'],['age','年龄'],['job','职业'],['religion','宗教'],['zodiac','星座']];
const SIDES=[['N','北',0,-1],['E','东',1,0],['S','南',0,1],['W','西',-1,0]];
const OPP={N:'S',S:'N',E:'W',W:'E'};
const sideOf=(dx,dy)=>SIDES.find(s=>s[2]===dx&&s[3]===dy)[0];
const DOOR_T={door:'双向门',open:'敞开通道',lock:'锁住的门',out:'单向门 · 只能出',in:'单向门 · 只能进'};
const DOOR_S={door:'门',open:'通道',lock:'锁门',out:'单向出',in:'单向进'};
const ARW={out:{N:'↑',E:'→',S:'↓',W:'←'},in:{N:'↓',E:'←',S:'↑',W:'→'}};
const doorSym=(t,s)=>t==='door'?'门':t==='open'?'通':t==='lock'?'锁':ARW[t][s];

const blankCard=()=>({info:{name:'',gender:'',age:'',job:'',religion:'',zodiac:''},vals:{},items:'',other:''});
const blankBg=(i=0)=>({identity:'',skills:[],goals:[],card:blankCard(),color:PALETTE[i%PALETTE.length],roomId:''});
const newDay=()=>({id:uid(),ended:false,events:[]});
const defaultCfg=()=>({points:40,attrs:['力量','技巧','敏捷','勇气','观察','理智','口才'].map(n=>({id:uid(),name:n,show:true}))});

// 新建实体模板
const newEntity=()=>({
id:uid(),
name:'新实体/遭遇',
category:'npc', // npc, monster, trap, object
disposition:'中立', // 友善, 中立, 敌对, 警惕, 隐藏
desc:'',
attrs:[{name:'HP',val:'10'},{name:'AC/护甲',val:'10'}], // 键值属性
actions:[{trigger:'遭遇/搭话时',effect:'提供线索或发起攻击'}], // 触发后果
dmNote:''
});

function blankRoom(x,y,name){return{id:uid(),x,y,name:name||'新房间',desc:'',dm:'',poolNote:'',items:[],doors:{},entities:[]}}
function blankData(){return{title:'我的原创模组',players:Array.from({length:7},(_,i)=>'玩家'+(i+1)),rooms:[],pool:[],cardCfg:defaultCfg(),bg:Array.from({length:7},(_,i)=>blankBg(i)),days:[newDay()],curDay:0,ui:{strip:true,showChar:true},log:[]}}
function fixItem(i){
if(!Array.isArray(i.owners)){i.owners=(i.owner!==undefined&&i.owner!=='')?[+i.owner]:[]}
delete i.owner;delete i.obtained;
}
function migrate(d){
if(!Array.isArray(d.players)||!d.players.length)d.players=blankData().players;
if(!Array.isArray(d.pool))d.pool=[];
if(!Array.isArray(d.bg))d.bg=[];
if(!Array.isArray(d.log))d.log=[];
if(!d.cardCfg||!Array.isArray(d.cardCfg.attrs))d.cardCfg=defaultCfg();
if(typeof d.cardCfg.points!=='number')d.cardCfg.points=40;
d.cardCfg.attrs.forEach(a=>{if(typeof a.show!=='boolean')a.show=true});
d.ui=Object.assign({strip:true,showChar:true},d.ui||{});
if(!Array.isArray(d.days)||!d.days.length)d.days=[newDay()];
d.days.forEach(x=>{if(!Array.isArray(x.events))x.events=[];if(!x.id)x.id=uid()});
if(!(d.curDay>=0&&d.curDay<d.days.length))d.curDay=0;
d.rooms.forEach(r=>{
  if(!r.doors||typeof r.doors!=='object'){
    r.doors={};
    SIDES.forEach(([s,,dx,dy])=>{if(d.rooms.some(o=>o.x===r.x+dx&&o.y===r.y+dy))r.doors[s]={t:'door',note:''}});
  }
  if(!Array.isArray(r.entities))r.entities=[];
  r.entities.forEach(en=>{
    if(!Array.isArray(en.attrs))en.attrs=[];
    if(!Array.isArray(en.actions))en.actions=[];
    if(!en.category)en.category='npc';
    if(!en.disposition)en.disposition='中立';
  });
});
d.players.forEach((_,i)=>{
  const b=d.bg[i]||(d.bg[i]=blankBg(i));
  if(!Array.isArray(b.skills))b.skills=[];
  if(!Array.isArray(b.goals))b.goals=[];
  if(typeof b.identity!=='string')b.identity='';
  if(typeof b.color!=='string'||!b.color)b.color=PALETTE[i%PALETTE.length];
  if(!d.rooms.some(r=>r.id===b.roomId))b.roomId='';
  if(!b.card)b.card=blankCard();
  const c=b.card;
  c.info=Object.assign(blankCard().info,c.info||{});
  if(!c.vals||typeof c.vals!=='object')c.vals={};
});
d.bg.length=d.players.length;
const n=d.players.length;
const fixAll=i=>{fixItem(i);i.owners=i.owners.filter(o=>o>=0&&o<n)};
d.rooms.forEach(r=>r.items.forEach(fixAll));
d.pool.forEach(fixAll);
return d;
}

let D=load();let sel=null;let selEntity=null;let edit=true;let poolQ='',poolT='';

function load(){
try{const s=localStorage.getItem(KEY);if(s)return migrate(JSON.parse(s))}catch(e){}
return migrate(DEFAULT_DATA?JSON.parse(JSON.stringify(DEFAULT_DATA)):blankData());
}
function save(){localStorage.setItem(KEY,JSON.stringify(D));renderStrip()}
const room=id=>D.rooms.find(r=>r.id===id);
const at=(x,y)=>D.rooms.find(r=>r.x===x&&r.y===y);
const isGot=i=>i.owners.length>0||i.consumed;
const newItem=()=>({id:uid(),type:'item',name:'',desc:'',cond:'',owners:[],consumed:false});
const rname=id=>id?((room(id)||{}).name||'未命名'):'未定位';
const pcolor=i=>(D.bg[i]&&D.bg[i].color)||'#888';

function findItem(id){
let l=D.pool.find(i=>i.id===id);if(l)return{item:l,list:D.pool,rid:''};
for(const r of D.rooms){const it=r.items.find(i=>i.id===id);if(it)return{item:it,list:r.items,rid:r.id}}
return null;
}

// ===== 日志 =====
function addLog(type,text,color=''){
D.log.push({id:uid(),ts:Date.now(),day:D.curDay+1,type,text,color});
if(D.log.length>2000)D.log.splice(0,D.log.length-2000);
if(document.getElementById('logDlg').open)renderLog();
}
let logF='all';
const LOG_TYPES=[['all','全部'],['item','📦 物品'],['attr','📊 属性'],['move','🚶 移动'],['day','🚩 日程']];
const logTime=ts=>new Date(ts).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
const logFiltered=()=>D.log.filter(e=>logF==='all'||e.type===logF);
function openLog(){renderLog();document.getElementById('logDlg').showModal()}
function renderLog(){
document.getElementById('logTabs').innerHTML=LOG_TYPES.map(([k,l])=>
  `<button class="${logF===k?'on':''}" onclick="logF='${k}';renderLog()">${l}</button>`).join('');
const list=logFiltered().slice().reverse();
document.getElementById('logList').innerHTML=list.length?list.map(e=>
  `<div class="lg ${e.type}"><span class="ld">Day ${e.day}</span><span class="lt">${logTime(e.ts)}</span>
    <span class="lx">${e.color?`<i class="cdot" style="background:${e.color}"></i>`:''}${esc(e.text)}</span></div>`).join('')
  :'<p class="hint">暂无记录。给玩家分配物资、改属性、换房间时会自动记录。</p>';
}
function copyLog(){
const t=logFiltered().map(e=>`[Day ${e.day} ${logTime(e.ts)}] ${e.text}`).join('\n');
if(!t){toast('没有可复制的记录');return}
copyText(t).then(ok=>ok?toast('📋 已复制日志'):prompt('请手动复制：',t));
}
function clearLog(){
if(!confirm('清空全部日志？此操作无法撤销。'))return;
D.log=[];save();renderLog();
}

// ===== 提示 / 复制 =====
let toastT;
function toast(msg){
const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1600);
}
function copyText(text){
const fallback=()=>{
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';
  document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy')}catch(_){}
  ta.remove();return ok;
};
if(navigator.clipboard&&window.isSecureContext){
  return navigator.clipboard.writeText(text).then(()=>true,()=>fallback());
}
return Promise.resolve(fallback());
}
function copyDesc(id){
const i=getItem(id);
if(!i.desc.trim()){toast('这张卡没有描述');return}
copyText(i.desc).then(ok=>toast(ok?'📋 已复制描述':'复制失败，请手动复制'));
}
function copyRoomDesc(){
const r=room(sel);if(!r)return;
if(!r.desc.trim()){toast('这个房间还没有描述');return}
copyText(r.desc).then(ok=>toast(ok?'📋 已复制房间描述':'复制失败，请手动复制'));
}

// ===== 玩家位置 =====
function roomSel(cur){
return `<option value="">📍 未定位</option>`+D.rooms.map(r=>
  `<option value="${r.id}" ${r.id===cur?'selected':''}>${esc(r.name)||'未命名'} (${r.x},${r.y})</option>`).join('');
}
function setPlayerRoom(i,rid){
const old=D.bg[i].roomId||'';
if(old===rid)return;
D.bg[i].roomId=rid;
addLog('move',`${pname(i)}：${rname(old)} → ${rname(rid)}`,pcolor(i));
save();renderMap();renderSide();
}
const chipHtml=i=>`<i class="chip" style="background:${pcolor(i)}" title="${esc(pname(i))}">${esc([...pname(i)][0]||'?')}</i>`;
const playersIn=rid=>D.players.map((_,i)=>i).filter(i=>D.bg[i].roomId===rid);

// ===== 左侧玩家属性栏 =====
function renderStrip(){
const s=document.getElementById('strip');if(!s||!D)return;
s.classList.toggle('hide',!D.ui.strip);
document.getElementById('stripOpen').style.display=D.ui.strip?'none':'block';
if(!D.ui.strip)return;
const attrs=D.cardCfg.attrs.filter(a=>a.show);
const cards=D.players.map((p,i)=>{
  const b=D.bg[i];if(!b)return'';
  const cn=D.ui.showChar&&b.card.info.name?`<div class="cn">${esc(b.card.info.name)}</div>`:'';
  const as=attrs.map(a=>{const v=+b.card.vals[a.id]||0;
    return `<span class="${v?'':'z'}"><i>${esc(a.name)}</i><b>${v}</b></span>`}).join('');
  return `<div class="pc" style="border-left-color:${b.color}" title="点击查看 ${esc(pname(i))} 的背景和车卡" onclick="bgSel=${i};openBg()">
    <div class="pn">${esc(pname(i))}</div>${cn}
    <select class="prm" title="所在房间" onclick="event.stopPropagation()" onchange="setPlayerRoom(${i},this.value)">${roomSel(b.roomId)}</select>
    ${attrs.length?`<div class="as">${as}</div>`:''}
  </div>`}).join('');
s.innerHTML=`<div class="sthead"><span style="margin-right:auto">👥 玩家属性</span>
    <button title="设置显示哪些属性" onclick="openStripCfg()">⚙</button>
    <button title="收起" onclick="setStrip(false)">◀</button></div>
  ${attrs.length?'':'<div class="hint">没有选择任何属性，点 ⚙ 设置</div>'}${cards}`;
}
function setStrip(v){D.ui.strip=v;save()}
function openStripCfg(){renderStripCfg();document.getElementById('stripDlg').showModal()}
function renderStripCfg(){
document.getElementById('stripCfgBox').innerHTML=
  `<label class="chkrow"><input type="checkbox" ${D.ui.showChar?'checked':''} onchange="D.ui.showChar=this.checked;save()"><span>显示角色姓名（车卡里填写的）</span></label>`+
  D.cardCfg.attrs.map(a=>`<label class="chkrow"><input type="checkbox" ${a.show?'checked':''} onchange="attrShow('${a.id}',this.checked)"><span>${esc(a.name)||'（未命名）'}</span></label>`).join('');
}
function attrShow(id,v){D.cardCfg.attrs.find(a=>a.id===id).show=v;save()}
function stripAll(v){D.cardCfg.attrs.forEach(a=>a.show=v);save();renderStripCfg()}

// ===== 画布平移 / 居中 =====
const wrap=document.getElementById('mapWrap'),grid=document.getElementById('grid');
const CELL_W=130+14,CELL_H=100+14;
let pan={x:0,y:0},lastMin=null;
function applyPan(){
grid.style.transform=`translate(${pan.x}px,${pan.y}px)`;
wrap.style.backgroundPosition=`${pan.x}px ${pan.y}px`;
}
function centerView(){
pan.x=Math.round((wrap.clientWidth-grid.offsetWidth)/2);
pan.y=Math.round((wrap.clientHeight-grid.offsetHeight)/2);
applyPan();
}
let drag=null,moved=false;
wrap.addEventListener('pointerdown',e=>{
if(e.button!==0||e.target.closest('.add,#centerBtn,#stripOpen'))return;
drag={sx:e.clientX,sy:e.clientY,px:pan.x,py:pan.y};moved=false;
});
window.addEventListener('pointermove',e=>{
if(!drag)return;
const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
if(!moved&&Math.hypot(dx,dy)<5)return;
moved=true;wrap.classList.add('dragging');
pan.x=drag.px+dx;pan.y=drag.py+dy;applyPan();
});
window.addEventListener('pointerup',()=>{drag=null;wrap.classList.remove('dragging')});
window.addEventListener('pointercancel',()=>{drag=null;wrap.classList.remove('dragging')});
wrap.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
wrap.addEventListener('wheel',e=>{
e.preventDefault();
pan.x-=e.shiftKey&&!e.deltaX?e.deltaY:e.deltaX;
pan.y-=e.shiftKey&&!e.deltaX?0:e.deltaY;
applyPan();
},{passive:false});

// ===== 地图 =====
function doorTitle(s,d){const l=SIDES.find(x=>x[0]===s)[1];return `${l}：${DOOR_T[d.t]}${d.note?'：'+d.note:''}`}
function doorsHtml(r){
return SIDES.filter(([s])=>r.doors[s]).map(([s])=>{const d=r.doors[s];
  return `<i class="dr ${d.t} ${s}" title="${esc(doorTitle(s,d))}">${doorSym(d.t,s)}</i>`}).join('');
}
function renderMap(){
if(!D.rooms.length){
  grid.style.display='block';
  grid.innerHTML='<div class="empty"><p>地图还是空的</p><button class="primary" onclick="addFirst()">＋ 创建第一个房间</button></div>';
  lastMin=null;centerView();return;
}
grid.style.display='grid';
const xs=D.rooms.map(r=>r.x),ys=D.rooms.map(r=>r.y);
const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
grid.style.gridTemplateColumns=`repeat(${maxX-minX+1},130px)`;
let h='';
for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){
  const r=at(x,y);
  if(!r){h+='<div class="cell"></div>';continue}
  const total=r.items.length,got=r.items.filter(isGot).length;
  const here=playersIn(r.id);
  const nEntity=r.entities?r.entities.length:0;
  const btn=(cls,dx,dy)=>at(x+dx,y+dy)?'':`<button class="add ${cls}" title="向此方向新增房间" onclick="event.stopPropagation();addRoom('${r.id}',${dx},${dy})">+</button>`;
  h+=`<div class="cell">
    <div class="room ${sel===r.id?'sel':''}" onclick="select('${r.id}')">
      <div class="name">${esc(r.name)||'未命名'}</div>
      <div class="pl">${here.map(chipHtml).join('')}</div>
      <div class="stat">
        <span>${nEntity?`🎭${nEntity}`:''}</span>
        <span>${total?`📦 ${got}/${total}`:'—'}</span>
      </div>
    </div>
    ${doorsHtml(r)}
    ${btn('t',0,-1)}${btn('bm',0,1)}${btn('l',-1,0)}${btn('r',1,0)}
  </div>`;
}
grid.innerHTML=h;
if(!lastMin){lastMin={x:minX,y:minY};centerView()}
else{
  pan.x-=(lastMin.x-minX)*CELL_W;pan.y-=(lastMin.y-minY)*CELL_H;
  lastMin={x:minX,y:minY};applyPan();
}
}
function addFirst(){const r=blankRoom(0,0,'入口');D.rooms.push(r);save();select(r.id);centerView()}
function addRoom(id,dx,dy){
const r=room(id);if(at(r.x+dx,r.y+dy))return;
const n=blankRoom(r.x+dx,r.y+dy);
r.doors[sideOf(dx,dy)]={t:'door',note:''};
n.doors[OPP[sideOf(dx,dy)]]={t:'door',note:''};
D.rooms.push(n);save();select(n.id);
}
function delRoom(id){
const r=room(id);
if(!confirm('确定删除该房间？'+(r.items.length?'\n房间内的物资不会丢失，会回到「未分配」物资池。':'')+(playersIn(id).length?'\n房间里的玩家会变成「未定位」。':'')))return;
D.pool.push(...r.items);
D.bg.forEach(b=>{if(b.roomId===id)b.roomId=''});
D.rooms=D.rooms.filter(x=>x.id!==id);
if(sel===id)closeSide();
save();renderMap();
}
function select(id){
sel=id;
selEntity=null; // 换房间时收起实体侧栏
renderMap();
renderSide();
renderEntitySide();
}
function closeSide(){
sel=null;
selEntity=null;
renderMap();
renderSide();
renderEntitySide();
}
function toggleMode(){
edit=!edit;document.body.classList.toggle('edit',edit);
const b=document.getElementById('modeBtn');b.classList.toggle('on',edit);
b.textContent=edit?'✏️ 编辑模式':'🎮 带团模式';
renderSide();
renderEntitySide();
}

// ===== 门 =====
function setDoor(s,t){
const r=room(sel);
if(!t)delete r.doors[s];
else r.doors[s]={t,note:(r.doors[s]&&r.doors[s].note)||''};
save();renderMap();renderSide();
}
function setDoorNote(s,v){const d=room(sel).doors[s];if(d){d.note=v;save()}}
function doorLock(s){
const d=room(sel).doors[s];if(!d)return;
d.t=d.t==='lock'?'door':'lock';
save();renderMap();renderSide();toast(d.t==='lock'?'🔒 已上锁':'🔓 已开锁');
}
function doorsCard(r){
if(edit){
  const rows=SIDES.map(([s,l,dx,dy])=>{
    const d=r.doors[s],n=at(r.x+dx,r.y+dy);
    return `<div class="drow"><b>${l}</b>
      <select onchange="setDoor('${s}',this.value)"><option value="">▭ 墙（无门）</option>${Object.entries(DOOR_T).map(([k,v])=>`<option value="${k}" ${d&&d.t===k?'selected':''}>${v}</option>`).join('')}</select>
      ${d?`<input type="text" value="${esc(d.note)}" placeholder="备注，如：通往地窖" oninput="setDoorNote('${s}',this.value)">`
         :`<span class="hint">${n?'邻接：'+esc(n.name||'未命名'):'无邻接房间'}</span>`}</div>`}).join('');

// ===== 日程 =====
let dayView=D.curDay;
const dayDlg=document.getElementById('dayDlg');
function updateDayBar(){
document.getElementById('dayBtn').textContent='📅 Day '+(D.curDay+1);
document.getElementById('endDayBtn').textContent='Day '+(D.curDay+1)+' 结束 ▶';
}
function openDays(){dayView=D.curDay;renderDays();dayDlg.showModal()}
function renderDays(){
if(dayView>=D.days.length)dayView=D.days.length-1;
const nav=document.getElementById('dayNav');
nav.innerHTML=D.days.map((d,i)=>{
  const n=d.events.length,dn=d.events.filter(e=>e.done).length;
  return `<button class="${i===dayView?'on':''} ${i===D.curDay?'cur':''}" onclick="dayView=${i};renderDays()">
    <span>Day ${i+1}</span><span class="dtag">${i===D.curDay?'🚩':d.ended?'✔':''}${n?` ${dn}/${n}`:''}</span></button>`}).join('')+
  `<button onclick="addDay()">＋ 新增一天</button>`;
const d=D.days[dayView],isCur=dayView===D.curDay;
const keep=document.getElementById('dayMain').scrollTop;
const evs=d.events.map(e=>`<div class="ev ${e.done?'done':''}">
    <div class="r1">
      <input type="checkbox" title="标记为已发生 / 已完成" ${e.done?'checked':''} onchange="evDone('${e.id}',this.checked)">
      <input type="text" class="tm" value="${esc(e.time)}" placeholder="时间" title="如：清晨 / 08:00 / 午夜" oninput="evUpd('${e.id}','time',this.value)">
      <input type="text" class="tt" value="${esc(e.title)}" placeholder="事件标题" oninput="evUpd('${e.id}','title',this.value)">
      <button onclick="evMove('${e.id}',-1)" title="上移">↑</button>
      <button onclick="evMove('${e.id}',1)" title="下移">↓</button>
      <button class="danger" onclick="evDel('${e.id}')">🗑</button>
    </div>
    <textarea placeholder="事件详情 / 触发条件 / 后续影响…" oninput="evUpd('${e.id}','detail',this.value)">${esc(e.detail)}</textarea>
  </div>`).join('')||'<p class="hint">这一天还没有事件，点击下方「＋ 添加事件」</p>';
document.getElementById('dayMain').innerHTML=`
  <div class="dayhead">
    <span class="nm">Day ${dayView+1}</span>
    ${isCur?'<span class="badge2 cur">当前日</span>':d.ended?'<span class="badge2">已结束</span>':'<span class="badge2">未开始</span>'}
    ${isCur?`<button class="primary" onclick="endDay()">Day ${dayView+1} 结束 ▶</button>`:`<button onclick="setCur(${dayView})">设为当前日</button>`}
    ${D.days.length>1?`<button class="danger" onclick="delDay()">删除这一天</button>`:''}
  </div>
  ${evs}
  <button class="primary" onclick="evAdd()">＋ 添加事件</button>`;
document.getElementById('dayMain').scrollTop=keep;
updateDayBar();
}
const evGet=id=>D.days[dayView].events.find(e=>e.id===id);
function evAdd(){D.days[dayView].events.push({id:uid(),time:'',title:'',detail:'',done:false});save();renderDays()}
function evDel(id){const d=D.days[dayView];d.events=d.events.filter(e=>e.id!==id);save();renderDays()}
function evUpd(id,k,v){evGet(id)[k]=v;save()}
function evDone(id,v){evGet(id).done=v;save();renderDays()}
function evMove(id,dir){
const a=D.days[dayView].events,i=a.findIndex(e=>e.id===id),j=i+dir;
if(j<0||j>=a.length)return;
[a[i],a[j]]=[a[j],a[i]];save();renderDays();
}
function addDay(){D.days.push(newDay());dayView=D.days.length-1;save();renderDays()}
function delDay(){
const d=D.days[dayView];
if(!confirm(`删除 Day ${dayView+1}${d.events.length?`（含 ${d.events.length} 个事件）`:''}？后面的天数会自动前移编号。`))return;
D.days.splice(dayView,1);
if(dayView<D.curDay)D.curDay--;
else if(dayView===D.curDay)D.curDay=Math.min(D.curDay,D.days.length-1);
dayView=Math.min(dayView,D.days.length-1);
save();renderDays();
}
function setCur(i){
D.curDay=i;D.days[i].ended=false;dayView=i;save();renderDays();toast('当前日：Day '+(i+1));
}
function endDay(){
const i=D.curDay,d=D.days[i];
const undone=d.events.filter(e=>!e.done);
if(!confirm(`确认结束 Day ${i+1}？`+(undone.length?`\n还有 ${undone.length} 个事件未完成。`:'')))return;
let carry=false;
if(undone.length)carry=confirm(`把这 ${undone.length} 个未完成事件顺延到 Day ${i+2}？\n\n确定 = 顺延　取消 = 保留在 Day ${i+1}`);
addLog('day',`—— Day ${i+1} 结束 ——`);
d.ended=true;
if(i===D.days.length-1)D.days.push(newDay());
const next=D.days[i+1];
if(carry){d.events=d.events.filter(e=>e.done);next.events.unshift(...undone)}
D.curDay=i+1;dayView=D.curDay;save();
if(dayDlg.open)renderDays();else updateDayBar();
toast(`Day ${i+1} 已结束，进入 Day ${i+2}`);
}

function pname(i){return D.players[i]||('玩家'+(i+1))}
const cardUsed=c=>D.cardCfg.attrs.reduce((s,a)=>s+(+c.vals[a.id]||0),0);
function renderBg(){
const keep=document.getElementById('bgMain').scrollTop;
document.getElementById('bgNav').innerHTML=D.players.map((p,i)=>
  `<button id="bgn${i}" class="${i===bgSel?'on':''}" style="border-left:4px solid ${pcolor(i)}" onclick="bgSel=${i};renderBg()">${i+1}. ${esc(pname(i))}</button>`).join('');
const b=D.bg[bgSel],c=b.card,cfg=D.cardCfg;
const sk=b.skills.map(s=>`<div class="item ${s.type}">
    <div class="row">
      <button class="tag ${s.type}" title="点击切换：技能 / 道具" onclick="skType('${s.id}')">${s.type==='skill'?'技能':'道具'}</button>
      <input type="text" value="${esc(s.name)}" placeholder="${s.type==='skill'?'技能名称':'道具名称'}" oninput="skUpd('${s.id}','name',this.value)">
      <button class="danger" onclick="skDel('${s.id}')">🗑</button>
    </div>
    <textarea style="min-height:44px;margin-top:6px" placeholder="效果 / 使用条件 / 次数限制…" oninput="skUpd('${s.id}','desc',this.value)">${esc(s.desc)}</textarea>
  </div>`).join('')||'<p class="hint">暂无，点击右上角添加</p>';
const gl=b.goals.map(g=>`<div class="goal ${g.done?'done':''}">
    <input type="checkbox" title="标记为已达成" ${g.done?'checked':''} onchange="goalDone('${g.id}',this.checked)">
    <textarea placeholder="例如：找到失踪的弟弟；不能让任何人知道你的真实身份…" oninput="goalUpd('${g.id}',this.value)">${esc(g.text)}</textarea>
    <button class="danger" onclick="goalDel('${g.id}')">🗑</button>
  </div>`).join('')||'<p class="hint">暂无，点击右上角添加</p>';
const used=cardUsed(c),remain=cfg.points-used;
const info=INFO_FIELDS.map(([k,l])=>
  `<label class="cf"><span>${l}</span><input type="text" value="${esc(c.info[k])}" oninput="D.bg[bgSel].card.info.${k}=this.value;save()"></label>`).join('');
const attrs=cfg.attrs.map(a=>`<div class="attr">
    <input type="text" class="an" value="${esc(a.name)}" title="属性名（所有玩家共用）" oninput="attrName('${a.id}',this.value)">
    <button onclick="attrStep('${a.id}',-1)">−</button>
    <input type="number" class="av" min="0" value="${+c.vals[a.id]||0}" onchange="attrSet('${a.id}',this.value)">
    <button onclick="attrStep('${a.id}',1)">＋</button>
    <button class="x danger" title="删除此属性（所有玩家）" onclick="attrDel('${a.id}')">✕</button>
  </div>`).join('');
document.getElementById('bgMain').innerHTML=`
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
    <input type="color" value="${b.color}" title="代表色" oninput="D.bg[bgSel].color=this.value;save();renderMap()" onchange="renderBg()">
    <input type="text" class="nm" style="margin:0" value="${esc(D.players[bgSel])}" placeholder="角色 / 玩家名" oninput="D.players[bgSel]=this.value;save();renderMap();document.getElementById('bgn'+bgSel).textContent=(bgSel+1)+'. '+pname(bgSel)">
    <select style="width:160px;flex:none" title="所在房间" onchange="setPlayerRoom(bgSel,this.value)">${roomSel(b.roomId)}</select>
  </div>

  <div class="divider"><b>📜 模组预设</b><span>由作者设定，玩家不可改</span></div>
  <div class="card"><h3>🪪 身份描述 <span class="hint">预设的身份、出身、与其他人的关系</span></h3>
    <textarea style="min-height:110px" oninput="D.bg[bgSel].identity=this.value;save()" placeholder="这个角色在剧本中是谁？">${esc(b.identity)}</textarea></div>
  <div class="card"><h3>🧰 技能 / 道具 <button class="primary" onclick="skAdd()">＋ 添加</button></h3>${sk}</div>
  <div class="card"><h3>🎯 角色目的 <button class="primary" onclick="goalAdd()">＋ 添加</button></h3>${gl}</div>

  <div class="divider"><b>📝 玩家车卡</b><span>由玩家自己填写</span></div>
  <div class="card"><h3>基础信息</h3><div class="cgrid">${info}</div></div>
  <div class="card"><h3>📊 属性分配 <button onclick="attrAdd()">＋ 新属性</button></h3>
    <div class="ptsbar">
      <span>可分配属性点数</span><input type="number" min="0" value="${cfg.points}" title="所有玩家共用" onchange="cfgPoints(this.value)"><span>点</span>
      <span class="mini">已用 ${used}</span>
      <span class="remain ${remain<0?'over':remain===0?'zero':'ok'}">剩余 ${remain}</span>
    </div>
    <div class="cgrid">${attrs}</div>
    <div class="hint" style="margin-top:6px">总点数、属性名称和数量对全部玩家通用；点数用完后无法继续增加。属性数值的每次变化都会记入「📜 日志」。</div>
  </div>
  <div class="card"><h3>🎒 随身物品</h3>
    <textarea oninput="D.bg[bgSel].card.items=this.value;save()" placeholder="玩家自带的物品…">${esc(c.items)}</textarea></div>
  <div class="card"><h3>🎭 其他背景 <span class="hint">性格、外貌、经历等</span></h3>
    <textarea style="min-height:110px" oninput="D.bg[bgSel].card.other=this.value;save()" placeholder="性格、外貌、习惯、个人经历…">${esc(c.other)}</textarea></div>
  <div style="text-align:right"><button onclick="copyBg()">📋 复制为文本（发给玩家）</button></div>`;
document.getElementById('bgMain').scrollTop=keep;
}
const bgSk=id=>D.bg[bgSel].skills.find(s=>s.id===id);
const bgGl=id=>D.bg[bgSel].goals.find(g=>g.id===id);
function skAdd(){D.bg[bgSel].skills.push({id:uid(),type:'skill',name:'',desc:''});save();renderBg()}
function skDel(id){const b=D.bg[bgSel];b.skills=b.skills.filter(s=>s.id!==id);save();renderBg()}
function skType(id){const s=bgSk(id);s.type=s.type==='skill'?'item':'skill';save();renderBg()}
function skUpd(id,k,v){bgSk(id)[k]=v;save()}
function goalAdd(){D.bg[bgSel].goals.push({id:uid(),text:'',done:false});save();renderBg()}
function goalDel(id){const b=D.bg[bgSel];b.goals=b.goals.filter(g=>g.id!==id);save();renderBg()}
function goalUpd(id,v){bgGl(id).text=v;save()}
function goalDone(id,v){bgGl(id).done=v;save();renderBg()}

function attrSet(id,v){
const c=D.bg[bgSel].card;
v=Math.max(0,Math.floor(+v)||0);
const old=+c.vals[id]||0;
const others=cardUsed(c)-old;
const max=Math.max(0,D.cardCfg.points-others);
if(v>max){v=max;toast('属性点不够了')}
c.vals[id]=v;
if(v!==old){
  const a=D.cardCfg.attrs.find(a=>a.id===id);
  addLog('attr',`${pname(bgSel)} 的「${a.name}」 ${old} → ${v}（${v>old?'+':''}${v-old}）`,pcolor(bgSel));
}
save();renderBg();
}
function attrStep(id,d){attrSet(id,(+D.bg[bgSel].card.vals[id]||0)+d)}
function attrName(id,v){D.cardCfg.attrs.find(a=>a.id===id).name=v;save()}
function attrAdd(){D.cardCfg.attrs.push({id:uid(),name:'新属性',show:true});save();renderBg()}
function attrDel(id){
if(!confirm('删除这个属性？所有玩家的该项数值都会清除。'))return;
D.cardCfg.attrs=D.cardCfg.attrs.filter(a=>a.id!==id);
D.bg.forEach(b=>delete b.card.vals[id]);save();renderBg();
}
function cfgPoints(v){D.cardCfg.points=Math.max(0,Math.floor(+v)||0);save();renderBg()}

function copyBg(){
const b=D.bg[bgSel],c=b.card,cfg=D.cardCfg;
const t=`【${pname(bgSel)}】\n\n■ 身份\n${b.identity||'（无）'}\n\n■ 技能 / 道具\n`+
  (b.skills.length?b.skills.map(s=>`· [${s.type==='skill'?'技能':'道具'}] ${s.name}：${s.desc}`).join('\n'):'（无）')+
  `\n\n■ 目的\n`+(b.goals.length?b.goals.map((g,i)=>`${i+1}. ${g.text}`).join('\n'):'（无）')+
  `\n\n■ 基础信息\n`+INFO_FIELDS.map(([k,l])=>`${l}：${c.info[k]||'-'}`).join('　')+
  `\n\n■ 属性（共 ${cfg.points} 点，剩余 ${cfg.points-cardUsed(c)}）\n`+cfg.attrs.map(a=>`${a.name} ${+c.vals[a.id]||0}`).join('　')+
  `\n\n■ 随身物品\n${c.items||'（无）'}\n\n■ 其他背景\n${c.other||'（无）'}`;
copyText(t).then(ok=>ok?toast('📋 已复制'):prompt('请手动复制：',t));
}

// ===== 物资总览 =====
function openSummary(){renderPool();document.getElementById('sumDlg').showModal()}
function roomOpts(cur){
return `<option value="">📥 未分配</option>`+D.rooms.map(r=>
  `<option value="${r.id}" ${r.id===cur?'selected':''}>${esc(r.name)||'未命名'} (${r.x},${r.y})</option>`).join('');
}
function poolRow(i,rid){
const st=i.consumed?'已消耗':i.owners.length?'已给 '+i.owners.map(n=>esc(pname(n))).join('、'):'';
return `<div class="prow2 ${i.type==='clue'?'clue':''} ${i.consumed?'consumed':''}">
  <div class="l1">
    <button class="tag ${i.type}" onclick="poolType('${i.id}')" title="点击切换类型">${i.type==='clue'?'线索':'道具'}</button>
    <input type="text" value="${esc(i.name)}" placeholder="物资名称" oninput="poolUpd('${i.id}','name',this.value)">
    ${st?`<span class="mini">${st}</span>`:''}
    <select onchange="moveItem('${i.id}',this.value)" title="分配到房间">${roomOpts(rid)}</select>
    <button class="danger" onclick="poolDel('${i.id}')">🗑</button>
  </div>
  <div class="l2">
    <input type="text" value="${esc(i.desc)}" placeholder="描述" oninput="poolUpd('${i.id}','desc',this.value)">
    <input type="text" value="${esc(i.cond)}" placeholder="获取条件" oninput="poolUpd('${i.id}','cond',this.value)">
  </div>
</div>`;
}
function renderPool(){
const q=poolQ.trim().toLowerCase();
const ok=i=>(!poolT||i.type===poolT)&&(!q||[i.name,i.desc,i.cond].some(s=>String(s||'').toLowerCase().includes(q)));
const groups=[{rid:'',name:'📥 未分配',list:D.pool,un:true},...D.rooms.map(r=>({rid:r.id,name:'🚪 '+(r.name||'未命名'),list:r.items}))];
let total=0,h='';
groups.forEach(g=>{
  const shown=g.list.filter(ok);total+=g.list.length;
  if(!shown.length&&!g.un)return;
  h+=`<div class="sec ${g.un?'un':''}"><span>${esc(g.name)}（${g.list.length}）</span></div>`;
  h+=shown.length?shown.map(i=>poolRow(i,g.rid)).join(''):'<p class="hint" style="margin:2px 0 6px">暂无</p>';
});
document.getElementById('poolList').innerHTML=total?h:h+'<p class="hint">还没有任何物资。点击右上「＋ 新物资」先创建一批，再分配到房间。</p>';
}
function addPoolItem(){D.pool.push(newItem());save();poolQ='';poolT='';
document.getElementById('poolQ').value='';document.getElementById('poolT').value='';
renderPool();document.getElementById('poolList').scrollTop=0;
}
function moveItem(id,to){
const f=findItem(id);if(!f)return;
f.list.splice(f.list.indexOf(f.item),1);
(to===''?D.pool:room(to).items).push(f.item);
save();renderMap();renderSide();renderPool();
}
function poolUpd(id,k,v){findItem(id).item[k]=v;save();renderSide()}
function poolType(id){const i=getItem(id);i.type=i.type==='clue'?'item':'clue';save();renderSide();renderPool()}
function poolDel(id){
if(!confirm('确定删除这件物资？'))return;
const f=findItem(id);f.list.splice(f.list.indexOf(f.item),1);
save();renderMap();renderSide();renderPool();
}

const HB_DUP=`
@page :right{margin:16mm 15mm 16mm 22mm}
@page :left{margin:16mm 22mm 16mm 15mm}
@page{@bottom-center{content:counter(page);font:10px sans-serif;color:#666}}
body.dup .ch,body.dup .hp{break-before:right;page-break-before:right}
body.dup .f{break-before:auto!important;page-break-before:auto!important}
`;
const typeL=t=>t==='clue'?'线索':t==='skill'?'技能':'道具';
const hLines=n=>'<div class="ln"></div>'.repeat(n);
const hTxt=(s,n=3,cls='')=>s&&String(s).trim()?`<div class="tx ${cls}">${esc(s)}</div>`:`<div>${hLines(n)}</div>`;
const hBx=on=>`<i class="box ${on?'ck':''}"></i>`;

function bgBlock(i,sv){
const b=D.bg[i];
return `<div class="lb">预设身份</div>${hTxt(b.identity,4)}
  <div class="lb">技能 / 道具</div>`+
  (b.skills.length?`<table><tr><th style="width:40px">类型</th><th style="width:22%">名称</th><th>效果 / 使用条件</th></tr>${b.skills.map(s=>`<tr><td>${typeL(s.type)}</td><td><b>${esc(s.name)}</b></td><td class="pre">${esc(s.desc)}</td></tr>`).join('')}</table>`:'<p class="note">（无）</p>')+
  `<div class="lb">角色目的</div>`+
  (b.goals.length?`<ul class="tight" style="list-style:none;padding:0">${b.goals.map(g=>`<li>${hBx(sv&&g.done)}<span class="pre">${esc(g.text)}</span></li>`).join('')}</ul>`:'<p class="note">（无）</p>');
}
function cardBlock(i,sv){
const c=D.bg[i].card,cfg=D.cardCfg;
let attrRows='';
for(let k=0;k<cfg.attrs.length;k+=2){
  const a=cfg.attrs[k],b2=cfg.attrs[k+1];
  attrRows+=`<tr><td class="k">${esc(a.name)}</td><td class="v">${sv?(+c.vals[a.id]||0):''}</td>${b2?`<td class="k">${esc(b2.name)}</td><td class="v">${sv?(+c.vals[b2.id]||0):''}</td>`:'<td class="k"></td><td class="v"></td>'}</tr>`;
}
return `<h3 class="sub" style="margin-top:14px">车卡</h3>
  <table class="sheet">${[0,2,4].map(k=>`<tr><td class="k">${INFO_FIELDS[k][1]}</td><td class="v">${sv?esc(c.info[INFO_FIELDS[k][0]]):''}</td><td class="k">${INFO_FIELDS[k+1][1]}</td><td class="v">${sv?esc(c.info[INFO_FIELDS[k+1][0]]):''}</td></tr>`).join('')}</table>
  <div class="lb">可分配属性点数：${cfg.points} 点${sv?`（已用 ${cardUsed(c)}，剩余 ${cfg.points-cardUsed(c)}）`:''}</div>
  <table class="sheet">${attrRows}</table>
  <div class="lb">随身物品</div>${hTxt(sv?c.items:'',3)}
  <div class="lb">其他背景（性格、外貌、经历）</div>${hTxt(sv?c.other:'',5)}`;
}

function hbHtml(o){
const title=D.title||'未命名模组';
const rooms=[...D.rooms].sort((a,b)=>a.y-b.y||a.x-b.x);
const num=new Map(rooms.map((r,i)=>[r.id,i+1]));
const pn=i=>esc(pname(i));
const doorList=r=>SIDES.filter(([s])=>r.doors[s]);
const dShort=r=>doorList(r).map(([s,l,dx,dy])=>{const t=r.doors[s].t,n=at(r.x+dx,r.y+dy);
  return `${l}${DOOR_S[t]}${t==='in'?'←':'→'}${n?num.get(n.id):'外'}`}).join('　')||'无';
const today=new Date().toLocaleDateString('zh-CN');
let h='';

h+=`<section class="cover"><h1>${esc(title)}</h1><div class="sub">DM 带团手册</div>
  <div class="meta">玩家 ${D.players.length} 人　·　房间 ${D.rooms.length} 间　·　共 ${D.days.length} 天<br>
  物资 ${D.pool.length+D.rooms.reduce((s,r)=>s+r.items.length,0)} 件<br>印制日期：${today}</div>
  <div class="dm">${o.dm?'含 DM 专属内容，请勿向玩家展示':'玩家可阅读版本'}</div></section>`;

h+=`<section class="ch"><div class="part">目 录</div>
  <table class="toc"><tr><th class="c">章节</th><th>内容</th></tr>
  <tr><td class="n">一</td><td>日程与事件</td></tr>
  <tr><td class="n">二</td><td>地图总览（含门与通道）与房间索引</td></tr>
  <tr><td class="n">三</td><td>房间详解（每间房独立一页：场景、实体/遭遇、门、DM 备注、物资）</td></tr>
  ${o.pl?'<tr><td class="n">四</td><td>玩家角色（预设背景 + 车卡，每人一页）</td></tr>':''}
  <tr><td class="n">${o.pl?'五':'四'}</td><td>附录：物资总表、属性追踪表、笔记页</td></tr></table>
  <h3 class="sub">玩家一览</h3>
  <table><tr><th class="c">#</th><th>玩家</th><th>角色姓名</th><th>代表色</th>${o.st?'<th>当前位置</th>':''}</tr>
  ${D.players.map((_,i)=>`<tr><td class="c">${i+1}</td><td>${pn(i)}</td><td>${esc(D.bg[i].card.info.name)}</td>
    <td><i class="dot" style="background:${pcolor(i)}"></i>${pcolor(i)}</td>${o.st?`<td>${D.bg[i].roomId?num.get(D.bg[i].roomId)+' '+esc(rname(D.bg[i].roomId)):'—'}</td>`:''}</tr>`).join('')}</table></section>`;

h+=`<section class="ch"><div class="part">一　日程与事件</div>`;
D.days.forEach((d,i)=>{
  h+=`<h3 class="sub">Day ${i+1}</h3><table><tr><th class="c" style="width:28px">✓</th><th style="width:70px">时间</th><th style="width:26%">事件</th><th>详情 / 触发条件</th></tr>`+
    (d.events.length?d.events.map(e=>`<tr><td class="c">${hBx(o.st&&e.done)}</td><td>${esc(e.time)}</td><td><b>${esc(e.title)||'（未命名）'}</b></td><td class="pre">${esc(e.detail)}</td></tr>`).join('')
    :`<tr><td colspan="4" class="note">（本日暂无预设事件）</td></tr>`)+
    `<tr><td class="c">${hBx(0)}</td><td></td><td></td><td></td></tr><tr><td class="c">${hBx(0)}</td><td></td><td></td><td></td></tr></table>`;
});
h+='</section>';

h+=`<section class="ch"><div class="part">二　地图总览</div>`;
if(!rooms.length)h+='<p class="note">尚未创建房间。</p>';
else{
  const xs=rooms.map(r=>r.x),ys=rooms.map(r=>r.y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  h+=`<div class="map" style="grid-template-columns:repeat(${maxX-minX+1},1fr)">`;
  for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){
    const r=at(x,y);
    if(!r){h+='<div class="mc e"></div>';continue}
    const here=o.st?playersIn(r.id):[];
    h+=`<div class="mc"><b>${num.get(r.id)}</b>${esc(r.name)||'未命名'}${here.length?`<div class="pl">${here.map(i=>`<i class="dot" style="background:${pcolor(i)}"></i>${pn(i)}`).join('　')}</div>`:''}
      ${doorList(r).map(([s])=>`<i class="hd ${r.doors[s].t} ${s}">${doorSym(r.doors[s].t,s)}</i>`).join('')}</div>`;
  }
  h+=`</div><p class="note">上北下南，左西右东。房间内侧每条边正中的小方块即该方向的门：<b>门</b>＝双向门　<b>通</b>＝敞开通道（虚线）　<b>锁</b>＝锁住的门（黑底）　<b>箭头</b>＝单向门（灰底，箭头方向为通行方向）。没有标记的边是墙；门不一定通向另一个房间。</p>`;
  h+=`<h3 class="sub">房间索引</h3><table><tr><th class="c">编号</th><th>房间</th><th>坐标</th><th>门与出口</th><th class="c">实体</th><th class="c">物资</th></tr>`+
    rooms.map(r=>`<tr><td class="c">${num.get(r.id)}</td><td><b>${esc(r.name)||'未命名'}</b></td><td>(${r.x},${r.y})</td><td>${dShort(r)}</td><td class="c">${(r.entities||[]).length}</td><td class="c">${r.items.length}</td></tr>`).join('')+'</table>';
}
h+='</section>';

h+=`<section class="ch"><div class="part">三　房间详解</div>`;
if(!rooms.length)h+='<p class="note">尚未创建房间。</p>';
rooms.forEach((r,idx)=>{
  const here=o.st?playersIn(r.id):[];
  h+=`<div class="rm ${idx?'':'f'}"><h2><span class="no">${num.get(r.id)}</span>${esc(r.name)||'未命名'}</h2>
    <div class="meta2">坐标 (${r.x},${r.y})${here.length?`　｜　当前在此：${here.map(pn).join('、')}`:''}</div>
    <div class="lb">场景描述（可念给玩家）</div>${hTxt(r.desc,3)}`;
  
  // 呈现该房间的实体与遭遇
  if((r.entities||[]).length){
    h+=`<div class="lb">🎭 场景固定实体 / 遭遇 / NPC</div>`;
    r.entities.forEach(en=>{
      h+=`<div class="hb-entity">
        <div class="hb-entity-title"><span>【${esc(en.category.toUpperCase())}】${esc(en.name)}</span><span>态度：${esc(en.disposition)}</span></div>
        ${en.desc?`<div style="font-size:12px;color:#333;margin-bottom:4px"><b>外貌台词：</b>${esc(en.desc)}</div>`:''}
        ${en.attrs.length?`<div style="font-size:12px;margin-bottom:4px"><b>属性：</b>${en.attrs.map(a=>`<u>${esc(a.name)}: ${esc(a.val)}</u>`).join('　')}</div>`:''}
        ${en.actions.length?`<table style="margin-top:4px"><tr><th style="width:30%">交互 / 触发时机</th><th>判定与后果反应</th></tr>${en.actions.map(act=>`<tr><td><b>${esc(act.trigger)}</b></td><td class="pre">${esc(act.effect)}</td></tr>`).join('')}</table>`:''}
        ${o.dm&&en.dmNote?`<div style="font-size:11.5px;color:#555;margin-top:2px">🔒 <b>幕后备注：</b>${esc(en.dmNote)}</div>`:''}
      </div>`;
    });
  }

  if(o.dm)h+=`<div class="lb">🔒 DM 专属内容</div>${hTxt(r.dm,3,'dm')}`;
  h+=`<div class="lb">物资判定 / 备注</div>${hTxt(r.poolNote,1)}`;
  h+=`<div class="lb">门与通道</div>`;
  const dl=doorList(r);
  h+=dl.length?`<table><tr><th style="width:44px">方位</th><th style="width:100px">类型</th><th style="width:30%">通往</th><th>备注</th></tr>`+
    dl.map(([s,l,dx,dy])=>{const d=r.doors[s],n=at(r.x+dx,r.y+dy);
      return `<tr><td>${l}</td><td>${DOOR_T[d.t]}</td><td>${d.t==='in'?'来自 ':''}${n?num.get(n.id)+' '+esc(n.name||'未命名'):'外部 / 未绘制区域'}</td><td class="pre">${esc(d.note)}</td></tr>`}).join('')+'</table>'
    :'<p class="note">（没有门，封闭空间）</p>';
  h+=`<div class="lb">物资清单</div>`;
  if(r.items.length){
    h+=`<table><tr><th class="c" style="width:28px">✓</th><th style="width:40px">类型</th><th style="width:18%">名称</th><th>描述</th><th style="width:22%">获取条件</th><th style="width:16%">${o.st?'获得者':'获得者（手写）'}</th></tr>`+
      r.items.map(i=>`<tr><td class="c">${hBx(o.st&&isGot(i))}</td><td>${typeL(i.type)}</td><td><b>${esc(i.name)||'（未命名）'}</b></td><td class="pre">${esc(i.desc)}</td><td class="pre">${esc(i.cond)}</td>
        <td>${o.st?(i.consumed?'已消耗 ':'')+i.owners.map(pn).join('、'):''}</td></tr>`).join('')+'</table>';
  }else h+='<p class="note">（此房间没有物资）</p>';
  h+='<div class="lb">本房间记录</div>'+hLines(3)+'</div>';
});
h+='</section>';

if(o.pl){
  h+=`<section class="ch"><div class="part">四　玩家角色</div>`;
  D.players.forEach((_,i)=>{
    const b=D.bg[i],c=b.card;
    h+=`<div class="player ${i?'':'f'}"><h2><i class="dot" style="background:${b.color};width:14px;height:14px"></i> ${pn(i)}${c.info.name&&o.st?`　<span style="font-size:14px;font-weight:normal">（${esc(c.info.name)}）</span>`:''}</h2>
      ${bgBlock(i,o.st)}${cardBlock(i,o.st)}</div>`;
  });
  h+='</section>';
}

const all=[...D.rooms.flatMap(r=>r.items.map(i=>({i,r}))),...D.pool.map(i=>({i,r:null}))];
h+=`<section class="ch"><div class="part">${o.pl?'五':'四'}　附录</div>
  <h3 class="sub">A. 物资总表</h3>`;
h+=all.length?`<table><tr><th class="c" style="width:28px">✓</th><th style="width:40px">类型</th><th style="width:20%">名称</th><th style="width:16%">所在房间</th><th>获取条件</th>${o.st?'<th>获得者</th>':''}</tr>`+
  all.map(({i,r})=>`<tr><td class="c">${hBx(o.st&&isGot(i))}</td><td>${typeL(i.type)}</td><td><b>${esc(i.name)||'（未命名）'}</b></td><td>${r?num.get(r.id)+' '+esc(r.name):'未分配'}</td><td class="pre">${esc(i.cond)}</td>${o.st?`<td>${(i.consumed?'已消耗 ':'')+i.owners.map(pn).join('、')}</td>`:''}</tr>`).join('')+'</table>':'<p class="note">（暂无物资）</p>';
h+=`<h3 class="sub">B. 玩家属性追踪表</h3><p class="note">带团时在格子里手写当前数值，随时涂改。</p>
  <table><tr><th>玩家</th>${D.cardCfg.attrs.map(a=>`<th class="c">${esc(a.name)}</th>`).join('')}</tr>`+
  D.players.map((_,i)=>`<tr><td><i class="dot" style="background:${pcolor(i)}"></i>${pn(i)}</td>${D.cardCfg.attrs.map(a=>`<td class="c" style="height:30px">${o.st?(+D.bg[i].card.vals[a.id]||0):''}</td>`).join('')}</tr>`).join('')+'</table>';
h+=`<h3 class="sub">C. 事件记录</h3><table><tr><th style="width:60px">Day</th><th style="width:70px">时间</th><th>事件 / 玩家行动 / 备注</th></tr>`+
  Array.from({length:14},()=>'<tr><td style="height:28px"></td><td></td><td></td></tr>').join('')+'</table></section>';
h+=`<section class="ch"><div class="part">笔记</div>${hLines(30)}</section>`;

return `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>${esc(title)} · DM 带团手册</title><style>${HB_CSS}${o.dup?HB_DUP:''}</style></head><body class="${o.dup?'dup':''}">${h}</body></html>`;
}

function hpHtml(o){
const title=D.title||'未命名模组';
const head=i=>`<div class="ph"><span>${esc(title)}</span><span>玩家角色卡</span></div>
  <h2><i class="dot" style="background:${pcolor(i)};width:14px;height:14px"></i> ${esc(pname(i))}　<span style="font-size:13px;font-weight:normal">玩家姓名：${'＿'.repeat(6)}</span></h2>`;
const pages=D.players.map((_,i)=>{
  const bg=o.bg?bgBlock(i,false):'';
  const card=cardBlock(i,o.fill);
  if(o.bg&&o.split)
    return `<section class="hp ${i?'':'f'}">${head(i)}<h3 class="sub">角色背景（请保密）</h3>${bg}</section>
            <section class="hpb">${head(i)}${card}</section>`;
  return `<section class="hp ${i?'':'f'}">${head(i)}${bg}${card}</section>`;
}).join('');
return `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>${esc(title)} · 玩家发放版</title><style>${HB_CSS}${o.dup?HB_DUP:''}</style></head><body class="${o.dup?'dup':''}">${pages}</body></html>`;
}

let hbMode='dm';
const hbOpts=()=>({
dm:document.getElementById('hbDM').checked,pl:document.getElementById('hbPl').checked,st:document.getElementById('hbSt').checked,
dup:document.getElementById('hbDup').checked,
bg:document.getElementById('hpBg').checked,fill:document.getElementById('hpFill').checked,split:document.getElementById('hpSplit').checked
});
const hbBuild=()=>hbMode==='dm'?hbHtml(hbOpts()):hpHtml(hbOpts());
function setHbMode(m){
hbMode=m;
document.getElementById('hbTabDm').classList.toggle('on',m==='dm');
document.getElementById('hbTabPl').classList.toggle('on',m==='pl');
document.getElementById('hbOptDm').style.display=m==='dm'?'flex':'none';
document.getElementById('hbOptPl').style.display=m==='pl'?'flex':'none';
refreshHandbook();
}
function openHandbook(){setHbMode(hbMode);document.getElementById('hbDlg').showModal()}
function refreshHandbook(){document.getElementById('hbFrame').srcdoc=hbBuild()}
function printHandbook(){
const f=document.getElementById('hbFrame');
try{f.contentWindow.focus();f.contentWindow.print()}
catch(e){toast('无法直接打印，请先「下载 HTML」后用浏览器打开再打印')}
}
function downloadHandbook(){
const a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([hbBuild()],{type:'text/html'}));
a.download=(D.title||'module')+(hbMode==='dm'?'-DM手册.html':'-玩家发放版.html');a.click();
}

// ===== 导入导出 =====
document.getElementById('modTitle').value=D.title;
document.getElementById('modTitle').oninput=e=>{D.title=e.target.value;save();document.title=D.title+' · DM 工具'};
function exportData(){
const a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));
a.download=(D.title||'module')+'.json';a.click();
}
function importData(e){
const f=e.target.files[0];if(!f)return;
const rd=new FileReader();
rd.onload=()=>{try{
  const d=JSON.parse(rd.result);if(!Array.isArray(d.rooms))throw 0;
  D=migrate(d);sel=null;selEntity=null;save();lastMin=null;bgSel=0;dayView=D.curDay;
  document.getElementById('modTitle').value=D.title||'';renderMap();renderSide();renderEntitySide();updateDayBar();updatePlayerBar();
}catch(_){alert('文件格式不正确')}};
rd.readAsText(f);e.target.value='';
}
function resetAll(){
if(!confirm('将清空全部内容（建议先导出备份），确定吗？'))return;
D=migrate(DEFAULT_DATA?JSON.parse(JSON.stringify(DEFAULT_DATA)):blankData());sel=null;selEntity=null;save();lastMin=null;bgSel=0;dayView=D.curDay;
document.getElementById('modTitle').value=D.title;renderMap();renderSide();renderEntitySide();updateDayBar();updatePlayerBar();
}
renderStrip();renderMap();updateDayBar();updatePlayerBar();
</script>
</body>
</html>
